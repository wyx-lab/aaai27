qlib_init:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn

market: csi500
benchmark: SH000905

data_handler_config: &data_handler_config
  start_time: 2018-01-01
  end_time: 2020-12-31
  fit_start_time: 2018-01-01
  fit_end_time: 2019-12-31
  instruments: csi500
  infer_processors:
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs:
        fields_group: label
  label:
    - ["Ref($close, -5) / Ref($close, -1) - 1"]
    - ["LABEL0"]

model:
  class: MDGNNQlibModel
  module_path: src.mdgnn_lite.qlib_model
  kwargs:
    window: 10
    hidden_dim: 128
    num_gnn_layers: 2
    num_heads: 4
    dropout: 0.1
    lr: 0.0001
    weight_decay: 0.0001
    batch_size: 4
    epochs: 20
    feature_norm: none
    feature_clip: null
    label_clip: null
    huber_delta: 1.0

dataset:
  class: DatasetH
  module_path: qlib.data.dataset
  kwargs:
    handler:
      class: Alpha158
      module_path: qlib.contrib.data.handler
      kwargs: *data_handler_config
    segments:
      train: [2018-01-01, 2019-12-31]
      valid: [2020-01-01, 2020-06-30]
      test: [2020-07-01, 2020-12-31]
