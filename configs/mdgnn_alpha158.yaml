qlib_init:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn

market: csi300
benchmark: SH000300

data_handler_config: &data_handler_config
  start_time: 2018-01-01
  end_time: 2023-12-31
  fit_start_time: 2018-01-01
  fit_end_time: 2021-12-31
  instruments: csi300
  infer_processors:
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs:
        fields_group: label
  label:
    - Ref($close, -5) / Ref($close, -1) - 1

model:
  class: MDGNNQlibModel
  module_path: src.mdgnn_lite.qlib_model
  kwargs:
    window: 10
    hidden_dim: 128
    num_gnn_layers: 2
    num_heads: 4
    dropout: 0.1
    lr: 0.0001
    weight_decay: 0.0001
    batch_size: 4
    epochs: 20
    feature_norm: none
    feature_clip: null
    label_clip: null

dataset:
  class: DatasetH
  module_path: qlib.data.dataset
  kwargs:
    handler:
      class: Alpha158
      module_path: qlib.contrib.data.handler
      kwargs: *data_handler_config
    segments:
      train: [2018-01-01, 2021-12-31]
      valid: [2022-01-01, 2022-12-31]
      test: [2023-01-01, 2023-12-31]

record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config:
        strategy:
          class: TopkDropoutStrategy
          module_path: qlib.contrib.strategy
          kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
        backtest:
          start_time: 2023-01-01
          end_time: 2023-12-31
          account: 100000000
          benchmark: SH000300
          exchange_kwargs:
            freq: day
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
